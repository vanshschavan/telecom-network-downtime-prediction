name: Automated Telecom ML Pipeline

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Data Generator & ML Pipeline
        run: |
          python src/generate_data.py
          python src/train_model.py

      - name: Commit Updated Scored Data
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "bot@github.com"
          git add data/telecom_predictions_powerbi.xlsx
          git commit -m "Auto-update: Refresh telecom predictions dataset [skip ci]" || echo "No changes to commit"
          git push